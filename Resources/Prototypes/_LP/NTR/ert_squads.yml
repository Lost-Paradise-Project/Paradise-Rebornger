# Basic ERT Coin

- type: entity
  id: LPPERTSecurityRifleCoin
  parent: BaseItem
  name: ert rifle security summoning coin
  description: Toss to summon an ert security.
  components:
  - type: Sprite
    sprite: Objects/Misc/coins.rsi # Replace with (_LP/Objects/Misc/coins.rsi state: nanotrasen) when able to
    state: coin_gold
  - type: GhostRole
    name: ghost-role-information-ert-security-name
    description: ghost-role-information-ert-security-description
    rules: ghost-role-information-nonantagonist-rules
    raffle:
      settings: short
    job: ERTSecurity
  - type: GhostRoleMobSpawner
    prototype: RandomHumanoidSpawnerERTSecurityArmedRifle

