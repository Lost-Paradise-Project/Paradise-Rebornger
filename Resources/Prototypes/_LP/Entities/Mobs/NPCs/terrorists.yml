# Террорист с калашом, сразу для битрана
# Поскольку террористы наследуются от панков, то у них уже есть компонент цели битрана. Фракция у них "AllHostile", вооот
- type: entity
  parent: LPPMobPunk
  id: LPPMobTerroristAutoRifle
  name: Terrorist
  description: There's no time for negotiations, they've planted the bomb!
  suffix: AI, AutoRifle, Bitrunning
  categories: [ HideSpawnMenu ]
  components:
  - type: Loadout
    prototypes:
    - LPPTerroristAutoRifle
  - type: HTN
    rootTask:
      task: SimpleHumanoidHostileCompound
    blackboard:
      NavClimb: !type:Bool
        true
      NavInteract: !type:Bool
        true
      NavPry: !type:Bool
        true
      NavSmash: !type:Bool
        true
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    animation: WeaponArcSlash
    damage:
      types:
        Slash: 15

