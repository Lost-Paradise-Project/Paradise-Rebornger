- type: entity
  parent: [ BaseItem, LPPStorePresetHOS ]
  id: LPPHOSUplinkShop
  name: Security Purchase Tablet
  description: A tablet for the Head of Security, which allows you to purchase equipment for yourself.
  suffix: Uplink Security
  components:
  - type: Sprite
    sprite: _LP/Objects/Devices/Security/HOSshop.rsi
    state: icon
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
  - type: ActivatableUI
    key: enum.StoreUiKey.Key
  - type: Store
    balance:
      LPPCentcoin: 15
  - type: Tag
    tags:
    - LPPHOSUplink

- type: entity
  parent: LPPHOSUplinkShop
  id: LPPHOSUplinkShopDebug
  suffix: Uplink Security, Debug
  components:
  - type: Store
    balance:
      LPPCentcoin: 99999

- type: currency
  id: LPPCentcoin
  displayName: store-currency-display-centcoin
  cash:
    1: LPPCentcoin
  canWithdraw: false

- type: currency
  id: LPPtelecrystal
  displayName: store-currency-display-telecrystal
  cash:
    1: Telecrystal
  canWithdraw: false
