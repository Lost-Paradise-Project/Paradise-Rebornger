- type: entity
  id: LPPMiningServerCircuitboardBroken
  parent: BaseMachineCircuitboard
  name: broken mining server board
  description: A machine printed circuit board for an mining server. It looks damaged.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: engineering
  - type: Appearance
  - type: MachineBoard
    prototype: MiningServer
    stackRequirements:
      Manipulator: 4
      Steel: 5
      Glass: 2
      Cable: 5
  - type: MiningServerCircuitboard
    condition: 0        # Сломанная плата
  - type: MiningServerCircuitboardVisuals
  - type: UserInterface
    interfaces:
      enum.MiningCircuitboardRepairUiKey.Key:
        type: MiningCircuitboardRepairBoundUserInterface
