- type: entity
  name: LE-MAS
  parent: [BaseWeaponRifle, BaseCentcommContraband]
  id: LPPWeaponRifleLemas
  description: Bullpup rifle made by FRENCH OPZ concern *ugh*. Fires 3 bullets in hyperburst. Uses .20 ammo.
  components:
  - type: Sprite
    sprite: _LP/Objects/Weapons/Guns/Rifles/le-mas.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _LP/Objects/Weapons/Guns/Rifles/le-mas.rsi
  - type: Gun
    fireRate: 3.5
    burstFireRate: 40
    selectedMode: SemiAuto
    availableModes:
      - Burst
      - SemiAuto
    shotsPerBurst: 3
    burstCooldown: 1
    soundGunshot:
      path: /Audio/_LP/Weapons/Guns/Gunshots/M4A1_Shot.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        startingItem: MagazineRifle
        insertSound: /Audio/_LP/Weapons/Guns/MagIn/M4A1_Magin.ogg
        ejectSound: /Audio/_LP/Weapons/Guns/MagOut/M4A1_Magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineRifle
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CartridgeRifle
        priority: 1
        whitelist:
          tags:
            - CartridgeRifle
      flashlight:
        name: weapon-upgrade-slot-name-flashlight
        priority: 0
        insertDelay: 0.8
        ejectDelay: 0.4
        ejectOnBreak: true
        occludesLight: false
        whitelist:
          components:
          - GunUpgradeFlashlight
      bayonet:
        name: weapon-upgrade-slot-name-bayonet
        priority: 0
        insertDelay: 2.0
        ejectDelay: 1.2
        ejectOnBreak: true
        whitelist:
          components:
          - GunUpgradeBayonet
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
      firing_pin: !type:Container # Starlight
      bayonet: !type:ContainerSlot
      flashlight: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: Item
    size: Large
  - type: EmitSoundOnPickup
    sound:
      collection: RiflesPickUp
  - type: EmitSoundOnDrop
    sound:
      collection: RiflesDrop
  - type: EmitSoundOnLand
    sound:
      collection: RiflesDrop
  - type: FiringPinHolder
    supportedPins: [ Rifle, GunUpgrade ]
  - type: ContainerFill
    containers:
      firing_pin:
      - FiringPin
  - type: ItemMapper
    mapLayers:
      bayonet:
        whitelist:
          components:
          - GunUpgradeBayonet
      flight:
        whitelist:
          components:
          - GunUpgradeFlashlight
  - type: UpgradeableWeapon
  - type: MeleeWeapon
    wideAnimationRotation: 270
    attackRate: 1
    angle: 0
    range: 1.1
    damage:
      types:
        Blunt: 5
  - type: MeleeWeaponRelay
  - type: AltFireMelee
    attackType: Heavy

