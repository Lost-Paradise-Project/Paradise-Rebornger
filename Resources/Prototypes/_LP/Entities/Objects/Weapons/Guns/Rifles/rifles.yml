      path: /Audio/Weapons/Guns/Gunshots/rifle2.ogg
  - type: BatteryAmmoProvider
    proto: CartridgeLightRifle
    fireCost: 1
  - type: Battery
    maxCharge: 120
    startingCharge: 120
  - type: Sprite
    sprite: Objects/Weapons/Guns/Rifles/ak.rsi
    layers:
      - state: icon

