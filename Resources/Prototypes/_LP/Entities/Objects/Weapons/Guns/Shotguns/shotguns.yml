- type: entity
  name: TBS-2s "Boomstick"
  parent: [BaseWeaponShotgun, BaseGunWieldable]
  id: LPPWeaponShotgunTBS2S
  description: A pump action shotgun that uses two tubes for ammo storaging, uses .50 ammo.
  components:
  - type: Sprite
    sprite: _LP/Objects/Weapons/Guns/Shotguns/Boomstick.rsi
  - type: Clothing
    sprite: _LP/Objects/Weapons/Guns/Shotguns/Boomstick.rsi
  - type: BallisticAmmoProvider
    capacity: 14
  - type: Gun
    soundGunshot:
      path: /Audio/_LP/Weapons/Guns/Gunshots/Boomstick.ogg
    fireRate: 2
  - type: Wieldable
  - type: GunRequiresWield
  - type: FiringPinHolder
    supportedPins: [ Rifle, GunUpgrade ]

# Дробовик для террористов битрана
- type: entity
  name: Stara
  parent: [BaseLaserRifle, BaseGunWieldable]
  id: LPPWeaponShotgunKammererBitrunning
  description: "A good old pump-action shotgun. \nLoaded with real digital .50 caliber ammo."
  categories: [ HideSpawnMenu ]
  components:
  - type: GunWieldBonus
    minAngle: 0
    maxAngle: 0
  - type: Gun
    fireRate: 0.5
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
    soundGunshot:
      path: /Audio/Corvax/Weapons/Guns/Gunshots/shotgun_alt.ogg
  - type: BatteryAmmoProvider
    proto: ShellShotgun
    fireCost: 1
  - type: Battery
    maxCharge: 40
    startingCharge: 40
  - type: Item
    sprite: Objects/Weapons/Guns/Shotguns/pump_inhands_64x.rsi
  - type: Sprite
    sprite: Objects/Weapons/Guns/Shotguns/pump.rsi
    layers:
      - state: icon
  - type: Clothing
    sprite: Objects/Weapons/Guns/Shotguns/pump.rsi
