- type: entity
  id: LPPRCDFAP
  parent: RCD
  name: RCDFAP
  description: The rapid construction device for atmospheric purposes can be used to quickly place and remove various station structures and fixtures. Requires compressed matter to function. It has a label "BL CORP Engineering Technology".
  components:
  - type: RCD
    isRpd: true
    availablePrototypes:
    - PipeFourway
    - PipeStraight
    - PipeBend
    - PipeTJunction
    - OutletInjector
    - ManualValve
    - VolumetricPump
    - PressurePump
    - VentScrubber
    - PressureValve
    - DualPortVent
    - VentGas
    - VentPassive
    - MixerGas
    - Radiator
    - RadiatorBend
    - SignalValve
    - CanisterPort
    - FilterGas
    - PipeHalf
    - PipeManifold
    - PressureRegulator
    - PassiveGate
    - PipeSensor
    - Deconstruct
    - AirAlarm
    - AirSensor
  - type: LimitedCharges
    maxCharges: 90
  - type: Sprite
    sprite: _LP/Objects/Tools/rcdfap.rsi
    state: icon
  - type: Clothing
    sprite: _LP/Objects/Tools/rcdfap.rsi
    quickEquip: false
    slots:
    - Belt

- type: entity
  id: LPPRCDFAPEmpty
  parent: LPPRCDFAP
  suffix: Empty
  components:
  - type: LimitedCharges
    lastCharges: -1

- type: entity
  id: LPPRCDFAPRecharging
  parent: LPPRCDFAP
  name: experimental RCDFAP
  description: Cyborg-mounted Rapid Construction Device For Atmospheric Purposes which creates compressed matter on the fly using an internal fabricator.
  suffix: AutoRecharge
  components:
  - type: LimitedCharges
    maxCharges: 120
  - type: AutoRecharge
    rechargeDuration: 3

- type: entity
  id: LPPRCDFAPExperimental
  parent: LPPRCDFAP
  suffix: Admeme
  name: experimental RCDFAP
  description: A bluespace-enhanced rapid construction device for atmospheric purposes that passively generates its own compressed matter.
  components:
  - type: LimitedCharges
    maxCharges: 300
  - type: AutoRecharge
    rechargeDuration: 0.1
