- type: entity
  id: LPPServiceProtolathe
  parent: [BaseLatheLube, BaseSiloUtilizer]
  name: service protolathe
  description: Prints equipment and circuitboards for use by service department.
  components:
  - type: Sprite
    sprite: _LP/Structures/Machines/serv_protolathe.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: LPPServiceProtolatheCircuitboard
  - type: Lathe
    idleState: icon
    runningState: building
    staticPacks:
    - ChemistryStatic
    - SurgeryStatic
    dynamicPacks:
    - PowerCells
    - AtmosTools
    - Janitor
    - Instruments
    - Equipment
  - type: MaterialStorage
    whitelist:
      tags:
        - Sheet
        - RawMaterial
        - Ingot

