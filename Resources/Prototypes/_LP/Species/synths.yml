- type: markingsGroup
  id: Synthoid
  onlyGroupWhitelisted: true # За что это отвечает? 
  limits:
    enum.HumanoidVisualLayers.Hair: # Волосы
      limit: 0
      required: false
    enum.HumanoidVisualLayers.FacialHair: # Усы
      limit: 0
      required: false
    enum.HumanoidVisualLayers.Chest: # Торс
      limit: 0
      required: false
    enum.HumanoidVisualLayers.Snout: # Лицо (у КПБ это экран)
      limit: 0 # нельзя менять
      required: true # Но что-то же должно быть? - принудительно стоит
    #  default: [ IpcOrangeS ] - вот этот тип. По итогу игрок меняет только цвет IpcOrangeS 
    enum.HumanoidVisualLayers.Head:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.Tail: # TODO добавить хвосты
      limit: 0
      required: false
    enum.HumanoidVisualLayers.Special:
      limit: 0
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceSynthoid
  name: synthoid appearance
  components:
  - type: InitialBody
    organs:
      Torso: OrganSynthoidTorso
      Head: OrganSynthoidHead
      ArmLeft: OrganSynthoidArmLeft
      ArmRight: OrganSynthoidArmRight
      HandRight: OrganSynthoidHandRight
      HandLeft: OrganSynthoidHandLeft
      LegLeft: OrganSynthoidLegLeft
      LegRight: OrganSynthoidLegRight
      FootLeft: OrganSynthoidFootLeft
      FootRight: OrganSynthoidFootRight
  - type: HumanoidProfile
    species: Synthoid

- type: entity
  parent: OrganBase
  id: OrganSynthoid
  abstract: true
  suffix: Synthoid

- type: entity
  parent: OrganSynthoid
  id: OrganSynthoidExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _LP/Mobs/Sint_parts.rsi
  - type: VisualOrgan
    data:
      sprite: _LP/Mobs/Sint_parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Synthoid

- type: entity
  parent:
  - AppearanceSynthoid
  - BaseSpeciesMob
  id: MobSynthoid
  name: Urissst Mz'Hand

- type: species
  id: Synthoid
  name: species-name-synthoid
  roundStart: true
  sponsorOnly: false
  prototype: MobSynthoid
  defaultSkinTone: "#34a223"
  dollPrototype: AppearanceSynthoid
  skinColoration: Hues
  maleFirstNames: NamesReptilianMale
  femaleFirstNames: NamesReptilianFemale
  naming: FirstDashFirst
  minHeight: 0.9
  defaultHeight: 1.05
  maxHeight: 1.22
  minWidth: 0.9
  defaultWidth: 1.05
  maxWidth: 1.22

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganSynthoidExternal ]
  id: OrganSynthoidTorso

- type: entity
  parent: [ OrganBaseHead, OrganSynthoidExternal ]
  id: OrganSynthoidHead
  # components:
  # - type: VisualcHead
  # components:
  # - type: VisualOrganMarkings
  #   hideableLayers:
  #   - enum.HumanoidVisualLayers.Hair
- type: entity
  parent: [ OrganBaseArmLeft, OrganSynthoidExternal ]
  id: OrganSynthoidArmLeft

- type: entity
  parent: [ OrganBaseArmRight, OrganSynthoidExternal ]
  id: OrganSynthoidArmRight

- type: entity
  parent: [ OrganBaseHandLeft, OrganSynthoidExternal ]
  id: OrganSynthoidHandLeft

- type: entity
  parent: [ OrganBaseHandRight, OrganSynthoidExternal ]
  id: OrganSynthoidHandRight

- type: entity
  parent: [ OrganBaseLegLeft, OrganSynthoidExternal ]
  id: OrganSynthoidLegLeft

- type: entity
  parent: [ OrganBaseLegRight, OrganSynthoidExternal ]
  id: OrganSynthoidLegRight

- type: entity
  parent: [ OrganBaseFootLeft, OrganSynthoidExternal ]
  id: OrganSynthoidFootLeft

- type: entity
  parent: [ OrganBaseFootRight, OrganSynthoidExternal ]
  id: OrganSynthoidFootRight

