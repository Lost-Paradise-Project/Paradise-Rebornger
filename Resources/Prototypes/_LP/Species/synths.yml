- type: markingsGroup
  id: Synthoid
  limits:
    enum.HumanoidVisualLayers.Hair: # Полностью скрываем обычные волосы.
      limit: 0
      required: false
      onlyGroupWhitelisted: true

    enum.HumanoidVisualLayers.FacialHair: # Полностью скрываем усы/бороду.
      limit: 0
      required: false
      onlyGroupWhitelisted: true

    enum.HumanoidVisualLayers.Chest: # Дополнительный _sint overlay для торса.
      limit: 1
      required: true # Один из вариантов torso overlay должен быть всегда.
      onlyGroupWhitelisted: true
      default: [ SynthTorsoSintMale ] # По умолчанию мужской вариант.

    enum.HumanoidVisualLayers.Snout: # Морда / экран.
      limit: 1
      required: false

    enum.HumanoidVisualLayers.Head: # Отдельные head-marking'и пока не используем.
      limit: 0
      required: false

    enum.HumanoidVisualLayers.HeadTop: # Верх головы: антенны.
      limit: 1
      required: false
      onlyGroupWhitelisted: true

    enum.HumanoidVisualLayers.HeadSide: # Боковые элементы головы: frills + их light overlay.
      limit: 2
      required: true # Базовые frills должны быть всегда.
      onlyGroupWhitelisted: true
      default: [ SynthFrillsDivinity ] # По умолчанию обычные frills.

    enum.HumanoidVisualLayers.LArm:
      limit: 0
      required: false

    enum.HumanoidVisualLayers.RArm:
      limit: 0
      required: false

    enum.HumanoidVisualLayers.LHand:
      limit: 0
      required: false

    enum.HumanoidVisualLayers.RHand:
      limit: 0
      required: false

    enum.HumanoidVisualLayers.LLeg:
      limit: 0
      required: false

    enum.HumanoidVisualLayers.RLeg:
      limit: 0
      required: false

    enum.HumanoidVisualLayers.LFoot:
      limit: 0
      required: false

    enum.HumanoidVisualLayers.RFoot:
      limit: 0
      required: false

    # Хвосты временно отключены:
    # спрайты сейчас поломаны, а marking'и закомментированы.
    # Поэтому слой НЕ должен быть required/default, иначе будет конфликт логики.
    enum.HumanoidVisualLayers.Tail:
      limit: 0
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceSynthoid
  name: synthoid appearance
  components:
  - type: InitialBody
    organs:
      Torso: OrganSynthoidTorso
      Head: OrganSynthoidHead
      ArmLeft: OrganSynthoidArmLeft
      ArmRight: OrganSynthoidArmRight
      HandRight: OrganSynthoidHandRight
      HandLeft: OrganSynthoidHandLeft
      LegLeft: OrganSynthoidLegLeft
      LegRight: OrganSynthoidLegRight
      FootLeft: OrganSynthoidFootLeft
      FootRight: OrganSynthoidFootRight
  - type: HumanoidProfile
    species: Synthoid

- type: entity
  parent: OrganBase
  id: OrganSynthoid
  abstract: true
  suffix: Synthoid

- type: entity
  parent: OrganSynthoid
  id: OrganSynthoidExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _LP/Mobs/Sint_parts.rsi
  - type: VisualOrgan
    data:
      sprite: _LP/Mobs/Sint_parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Synthoid

- type: entity
  parent:
  - AppearanceSynthoid
  - BaseSpeciesMob
  id: MobSynthoid
  name: Urissst Mz'Hand

# Временная species-конфигурация.
# Позже можно будет отдельно переработать sponsorOnly, имена и прочее.
- type: species
  id: Synthoid
  name: species-name-synthoid
  roundStart: true
  sponsorOnly: false
  prototype: MobSynthoid
  defaultSkinTone: "#34a223"
  dollPrototype: AppearanceSynthoid
  skinColoration: Hues
  maleFirstNames: NamesReptilianMale
  femaleFirstNames: NamesReptilianFemale
  naming: FirstDashFirst
  minHeight: 0.9
  defaultHeight: 1.05
  maxHeight: 1.22
  minWidth: 0.9
  defaultWidth: 1.05
  maxWidth: 1.22

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganSynthoidExternal ]
  id: OrganSynthoidTorso

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganSynthoidExternal ]
  id: OrganSynthoidHead
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Snout
    - enum.HumanoidVisualLayers.HeadTop
    - enum.HumanoidVisualLayers.HeadSide

- type: entity
  parent: [ OrganBaseArmLeft, OrganSynthoidExternal ]
  id: OrganSynthoidArmLeft

- type: entity
  parent: [ OrganBaseArmRight, OrganSynthoidExternal ]
  id: OrganSynthoidArmRight

- type: entity
  parent: [ OrganBaseHandLeft, OrganSynthoidExternal ]
  id: OrganSynthoidHandLeft

- type: entity
  parent: [ OrganBaseHandRight, OrganSynthoidExternal ]
  id: OrganSynthoidHandRight

- type: entity
  parent: [ OrganBaseLegLeft, OrganSynthoidExternal ]
  id: OrganSynthoidLegLeft

- type: entity
  parent: [ OrganBaseLegRight, OrganSynthoidExternal ]
  id: OrganSynthoidLegRight

- type: entity
  parent: [ OrganBaseFootLeft, OrganSynthoidExternal ]
  id: OrganSynthoidFootLeft

- type: entity
  parent: [ OrganBaseFootRight, OrganSynthoidExternal ]
  id: OrganSynthoidFootRight

- type: marking
  id: SynthHeadWin
  bodyPart: Snout
  groupWhitelist: [ Synthoid ] # Маркировка доступна только синтойду.
  sprites:
  - sprite: _LP/Mobs/Sint_parts.rsi
    state: head_win

- type: marking
  id: SynthTorsoSintMale
  bodyPart: Chest
  groupWhitelist: [ Synthoid ] # Только синтойдам.
  sprites:
  - sprite: _LP/Mobs/Sint_parts.rsi
    state: torso_m_sint

- type: marking
  id: SynthTorsoSintFemale
  bodyPart: Chest
  groupWhitelist: [ Synthoid ] # Только синтойдам.
  sprites:
  - sprite: _LP/Mobs/Sint_parts.rsi
    state: torso_f_sint

- type: marking
  id: SynthAntennas # Антенны.
  bodyPart: HeadTop
  groupWhitelist: [ Synthoid ] # Только синтойду.
  sprites:
  - sprite: _LP/Mobs/Customization/Sint_parts.rsi
    state: antennas

- type: marking
  id: SynthFrillsDivinity
  bodyPart: HeadSide
  groupWhitelist: [ Synthoid ]
  sprites:
  - sprite: _LP/Mobs/Customization/Sint_parts.rsi
    state: frills_divinity

- type: marking
  id: SynthFrillsDivinityLight
  bodyPart: HeadSide
  groupWhitelist: [ Synthoid ]
  sprites:
  - sprite: _LP/Mobs/Customization/Sint_parts.rsi
    state: frills_divinity_light

