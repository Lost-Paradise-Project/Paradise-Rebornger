- type: entity
  parent:
  - AppearanceSynthoid
  - BaseSpeciesMobOrganic
  id: MobSynthoid
  name: Urissst Mz'Hand
  components:
  - type: Puller
    needsHands: false
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatLizard
      amount: 5
  - type: LizardAccent
  - type: Speech
    speechSounds: Lizard
    speechVerb: Reptilian
    allowedEmotes: [ 'Thump' ]
  - type: TypingIndicator
    proto: lizard
  - type: Vocal
    sounds:
      Male: MaleReptilian
      Female: FemaleReptilian
      Unsexed: MaleReptilian
  - type: BodyEmotes
    soundsId: ReptilianBodyEmotes
  - type: Damageable
    damageModifierSet: Scale
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 5
  - type: Temperature
    currentTemperature: 310.15
    specificHeat: 42
  - type: TemperatureDamage
    heatDamageThreshold: 400
    coldDamageThreshold: 285
    coldDamage:
      types:
        Cold: 0.1
    heatDamage:
      types:
        Heat: 1.5
  - type: TemperatureSpeed
    thresholds:
      301: 0.9
      295: 0.8
      285: 0.7
  - type: Wagging

- type: species
  id: Synthoid
  name: species-name-synthoid
  roundStart: true
  sponsorOnly: true
  prototype: MobSynthoid
  defaultSkinTone: "#34a223"
  dollPrototype: AppearanceSynthoid
  skinColoration: Hues
  maleFirstNames: NamesReptilianMale
  femaleFirstNames: NamesReptilianFemale
  naming: FirstDashFirst
  minHeight: 0.9
  defaultHeight: 1.05
  maxHeight: 1.22
  minWidth: 0.9
  defaultWidth: 1.05
  maxWidth: 1.22

- type: entity
  parent: [ OrganBaseArmLeft, OrganSynthoidExternal ]
  id: OrganSynthoidArmLeft

- type: entity
  parent: [ OrganBaseArmRight, OrganSynthoidExternal ]
  id: OrganSynthoidArmRight

- type: entity
  parent: [ OrganBaseHandLeft, OrganSynthoidExternal ]
  id: OrganSynthoidHandLeft

- type: entity
  parent: [ OrganBaseHandRight, OrganSynthoidExternal ]
  id: OrganSynthoidHandRight

- type: entity
  parent: [ OrganBaseLegLeft, OrganSynthoidExternal ]
  id: OrganSynthoidLegLeft

- type: entity
  parent: [ OrganBaseLegRight, OrganSynthoidExternal ]
  id: OrganSynthoidLegRight

- type: entity
  parent: [ OrganBaseFootLeft, OrganSynthoidExternal ]
  id: OrganSynthoidFootLeft

- type: entity
  parent: [ OrganBaseFootRight, OrganSynthoidExternal ]
  id: OrganSynthoidFootRight

