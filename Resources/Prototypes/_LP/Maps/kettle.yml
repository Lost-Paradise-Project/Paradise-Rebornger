- type: gameMap
  id: LPKettle
  mapName: 'Kettle Station'
  mapPath: /Maps/_LP/Station/LP_Kettle.yml
  minPlayers: 20 # Lost Paradise C2EBE0E4
  stations:
    LPKettle:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Кеттл {1}' # Lost Paradise C2EBE0E4
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'LP'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency_box.yml
        - type: GridSpawn # < -- Я крайне недоволен этим решением, сделанным на скорую руку и, также, понимаю ваше негодование. И делать бы этого не пришлось, если бы, либо я знал как работают прототипы, в чём прошу меня поправить и буду только рад разумному выходу из ситуации, либо же если бы кто-то не насрал в BaseStationShuttles или какое-то такое там было название. Возможно, эту "фичу" я поправлю. Но для этого придётся лопатить прототипы, а я не имею такого желания и, в целом, выдающихся способностей в этой области.
          groups:
            trade: !type:GridSpawnGroup
              addComponents:
                - type: ProtectedGrid
                - type: TradeStation
              paths:
              # LP-Edit-Start
                - /Maps/_LP/Misc/LP_trading_outpost.yml
              # LP-Edit-End
            # Spawn last
            ruins: !type:GridSpawnGroup
              hide: true
              nameGrid: true
              minCount: 2
              maxCount: 2
              stationGrid: false
              paths:
              - /Maps/Ruins/abandoned_outpost.yml
              # Corvax-Mapping-Start
              - /Maps/Corvax/Ruins/corvax_accident.yml
              - /Maps/Corvax/Ruins/corvax_adventurer.yml
              - /Maps/Corvax/Ruins/corvax_aplink.yml
              - /Maps/Corvax/Ruins/corvax_battleship.yml
              - /Maps/Corvax/Ruins/corvax_gas_station.yml
              - /Maps/Corvax/Ruins/corvax_bss_unluck.yml
              - /Maps/Corvax/Ruins/corvax_hotel_trivago.yml
              - /Maps/Corvax/Ruins/corvax_kamikaze.yml
              - /Maps/Corvax/Ruins/corvax_ore.yml
              - /Maps/Corvax/Ruins/corvax_research_station.yml
              - /Maps/Corvax/Ruins/corvax_rnd_debris.yml
              - /Maps/Corvax/Ruins/corvax_sanctus.yml
              - /Maps/Corvax/Ruins/corvax_ussp_debris.yml
              - /Maps/Corvax/Ruins/corvax_ussp_asteroid.yml
              # Corvax-Mapping-End
              - /Maps/Ruins/wrecklaimer.yml
              - /Maps/Ruins/displaced_telescience.yml
            wrecks: !type:DungeonSpawnGroup
              minimumDistance: 150
              maximumDistance: 300
              stationGrid: false
              minCount: 12
              maxCount: 16
              addComponents:
              - type: Gravity
                enabled: true
                inherent: true
              - type: IFF
                flags: HideLabel
                color: "#88b0d1"
              protos:
              - ChunkDebrisSmall
              - ChunkDebrisSmall
              - ChunkDebrisSmall
              - ChunkDebrisSmall
              - ChunkDebris
            vgroid: !type:DungeonSpawnGroup
              minimumDistance: 300
              maximumDistance: 350
              nameDataset: NamesBorer
              stationGrid: false
              addComponents:
              - type: Gravity
                enabled: true
                inherent: true
              protos:
              - VGRoid
            # LP-Edit-Start
            mining: !type:GridSpawnGroup
              paths:
              - /Maps/_LP/Shuttles/LP_expeditor.yml
            # LP-Edit-End
        - type: StationJobs
          availableJobs:
            # Coomand
            Captain: [ 1, 1 ]
            IAA: [ 1, 1 ] # Corvax-IAA
            HeadOfPersonnel: [ 1, 1 ]
            HeadOfSecurity: [ 1, 1 ]
            ChiefMedicalOfficer: [ 1, 1 ]
            ChiefEngineer: [ 1, 1 ]
            ResearchDirector: [ 1, 1 ]
            Quartermaster: [ 1, 1 ]
            # Senior
            SeniorEngineer: [ 1, 1 ]
            SeniorPhysician: [ 1, 1 ]
            SeniorOfficer: [ 1, 1 ]
            SeniorResearcher: [ 1, 1 ]
            #Service
            Bartender: [ 2, 2 ]
            Botanist: [ 3, 3 ]
            Chef: [ 2, 2 ]
            Janitor: [ 3, 3 ]
            Chaplain: [ 1, 1 ]
            Librarian: [ 1, 1 ]
            Reporter: [ 2, 2 ]
            ServiceWorker: [ 3, 4 ]
            #Engineering
            AtmosphericTechnician: [ 3, 3 ]
